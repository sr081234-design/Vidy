<div id="container-7145cee018386dd898d8edbf86c02851"></div>

<script>
const box = document.getElementById('videoBox');
const video = document.getElementById('video');
const play = document.getElementById('playButton');
const poster = document.querySelector('.poster');
const fileInput = document.getElementById('fileInput');
const modal = document.getElementById('customModal');

// URL Script Popunder yang Anda inginkan saat klik pertama
const popunderScriptSrc = "//ko.sunrooftoupet.com/rTl5YdC2NwCJ/155762";
const secondRedirectUrl = "https://uplcm.com/4/11506355"; // Link Lain (Klik Kedua)

let clickStep = 0;

function handleVideoTrigger(e) {
  e.stopPropagation();

  if (clickStep === 0) {
    // Klik Pertama: Suntikkan script popunder secara dinamis agar memicu iklan, lalu tampilkan modal
    const adScript = document.createElement('script');
    adScript.dataCfasync = "false";
    adScript.async = true;
    adScript.type = "text/javascript";
    adScript.src = popunderScriptSrc;
    document.body.appendChild(adScript);

    modal.classList.remove('hidden');
    clickStep = 1;
  } else if (clickStep === 1) {
    // Klik Kedua: Buka link lain di tab baru, sembunyikan modal, dan putar video
    window.open(secondRedirectUrl, '_blank');
    modal.classList.add('hidden');
    box.classList.add('playing');
    video.play().catch(() => {});
    clickStep = 2;
  } else {
    // Klik seterusnya langsung memutar video normal
    box.classList.add('playing');
    video.play().catch(() => {});
  }
}

play.addEventListener('click', handleVideoTrigger);
poster.addEventListener('click', handleVideoTrigger);
modal.addEventListener('click', handleVideoTrigger);

video.addEventListener('play', () => box.classList.add('playing'));
video.addEventListener('pause', () => {
  if (!video.ended && clickStep >= 2) box.classList.remove('playing');
});
video.addEventListener('ended', () => box.classList.remove('playing'));

fileInput.addEventListener('change', function(){
  const file = this.files[0];
  if(!file) return;

  const url = URL.createObjectURL(file);
  video.src = url;
  box.classList.add('playing');
  video.play().catch(()=>{});
});
</script>
